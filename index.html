<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe vs Computer</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --cell-size: 100px;
            --primary-color: #333;
            --x-color: #ff5e5e;
            --o-color: #588cff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
        }

        h1 { color: var(--primary-color); }

        #status {
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, var(--cell-size));
            grid-template-rows: repeat(3, var(--cell-size));
            gap: 10px;
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: #fff;
            border: 2px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .cell:hover { background-color: #eee; }
        .cell.taken { cursor: not-allowed; }
        .cell.x { color: var(--x-color); }
        .cell.o { color: var(--o-color); }

        button {
            margin-top: 30px;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <h1>Tic-Tac-Toe</h1>
    <div id="status">Your turn (X)</div>

    <div class="board" id="board">
        </div>

    <button onclick="resetGame()">Reset Game</button>

    <script>
        class TicTacToe {
            constructor() {
                this.reset();
            }

            reset() {
                this.board = Array.from({ length: 3 }, () => Array(3).fill(" "));
                this.currentPlayer = 1; // 1 = Human (X), 2 = Computer (O)
                this.isGameOver = false;
            }

            makeMove(row, col) {
                if (this.isGameOver || this.board[row][col] !== " ") return false;
                
                this.board[row][col] = this.currentPlayer === 1 ? "X" : "O";
                if (this.checkWinner() || this.isBoardFull()) {
                    this.isGameOver = true;
                } else {
                    this.currentPlayer = 3 - this.currentPlayer;
                }
                return true;
            }

            checkWinner() {
                const b = this.board;
                // Rows, Cols, Diagonals
                for (let i = 0; i < 3; i++) {
                    if (b[i][0] !== " " && b[i][0] === b[i][1] && b[i][1] === b[i][2]) return true;
                    if (b[0][i] !== " " && b[0][i] === b[1][i] && b[1][i] === b[2][i]) return true;
                }
                if (b[0][0] !== " " && b[0][0] === b[1][1] && b[1][1] === b[2][2]) return true;
                if (b[0][2] !== " " && b[0][2] === b[1][1] && b[1][1] === b[2][0]) return true;
                return false;
            }

            isBoardFull() {
                return this.board.every(row => row.every(cell => cell !== " "));
            }

            getAvailableMoves() {
                let moves = [];
                for (let r = 0; r < 3; r++) {
                    for (let c = 0; c < 3; c++) {
                        if (this.board[r][c] === " ") moves.push({r, c});
                    }
                }
                return moves;
            }
        }

        const game = new TicTacToe();
        const boardElement = document.getElementById('board');
        const statusElement = document.getElementById('status');

        function createBoard() {
            boardElement.innerHTML = '';
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', () => handleMove(r, c));
                    boardElement.appendChild(cell);
                }
            }
        }

        function handleMove(r, c) {
            if (game.currentPlayer !== 1 || game.isGameOver) return;

            if (game.makeMove(r, c)) {
                updateUI();
                if (!game.isGameOver) {
                    statusElement.innerText = "Computer is thinking...";
                    setTimeout(computerMove, 600);
                }
            }
        }

        function computerMove() {
            const moves = game.getAvailableMoves();
            if (moves.length > 0) {
                // Simple AI: Picks a random available spot
                const move = moves[Math.floor(Math.random() * moves.length)];
                game.makeMove(move.r, move.c);
                updateUI();
            }
        }

        function updateUI() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const r = cell.dataset.row;
                const c = cell.dataset.col;
                const val = game.board[r][c];
                cell.innerText = val;
                if (val !== " ") {
                    cell.classList.add('taken', val.toLowerCase());
                }
            });

            if (game.checkWinner()) {
                const winner = game.currentPlayer === 1 ? "Computer (O)" : "You (X)";
                statusElement.innerText = `${winner} Wins!`;
            } else if (game.isBoardFull()) {
                statusElement.innerText = "It's a Draw!";
            } else {
                statusElement.innerText = game.currentPlayer === 1 ? "Your turn (X)" : "Computer's turn (O)";
            }
        }

        function resetGame() {
            game.reset();
            statusElement.innerText = "Your turn (X)";
            createBoard();
        }

        createBoard();
    </script>
</body>
</html>
