<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe vs Neural Network</title>
    
    <!-- 1. Import Brain.js for the Neural Network -->
    <script src="https://unpkg.com/brain.js"></script>
    <style src="brain.css"></style>    
    
</head>
<body>

    <div class="presentation-wrapper">
        
        <!-- LEFT PANEL: The Game -->
        <div class="game-container">
            <h1>Tic-Tac-Toe</h1>
            <div id="status">Training Brain.js...</div>
            <div class="board" id="board"></div>
            <button onclick="resetGame()">Reset Game</button>
        </div>

        <!-- RIGHT PANEL: The Presentation Log -->
        <div class="ai-panel">
            <h3 class="ai-header">🧠 Brain.js Thought Process</h3>
            <div class="log-box" id="logBox"></div>
        </div>

    </div>

    <script src="brain.js">    
    </script>
</body>
</html>
